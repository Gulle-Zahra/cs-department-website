name: CD — Deploy to Development

on:
  push:
    branches: [develop]

jobs:
  deploy-development:
    name: Deploy to Development (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t cs-website:dev .
          echo "✅ Docker image built successfully"

      - name: Test Docker container
        run: |
          docker run -d -p 8080:80 --name dev-test cs-website:dev
          sleep 3
          curl -f http://localhost:8080 && echo "✅ Container is serving correctly"
          docker stop dev-test && docker rm dev-test

      - name: Prepare files for deployment
        run: |
          mkdir -p deploy-dev
          cp -r *.html css deploy-dev/

      - name: Deploy to GitHub Pages — dev folder
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-dev
          destination_dir: dev
          commit_message: "deploy: development from ${{ github.sha }}"

      - name: Print live URL
        run: echo "🚀 Live at https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/dev"

