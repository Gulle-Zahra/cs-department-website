name: CD — Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    name: Deploy to Production (GitHub Pages)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (verify containerization works)
        run: |
          docker build -t cs-website:production .
          echo "✅ Docker image built successfully"

      - name: Test Docker container
        run: |
          docker run -d -p 8080:80 --name prod-test cs-website:production
          sleep 3
          curl -f http://localhost:8080 && echo "✅ Container serving correctly"
          docker stop prod-test && docker rm prod-test

      - name: Prepare deployment folder
        run: |
          mkdir -p deploy-prod
          cp -r *.html css deploy-prod/

      - name: Deploy to GitHub Pages (root = production)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-prod
          destination_dir: production
          commit_message: "deploy: production environment from ${{ github.sha }}"

      - name: Deployment summary
        run: |
          echo "🚀 Production deployed!"
          echo "URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/production"

