name: CD — Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy-production:
    name: Deploy to Production (Render)
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy (Production)
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" \
            -H "Content-Type: application/json" \
            --fail \
            && echo "✅ Production deploy triggered successfully"

      - name: Confirm deployment
        run: echo "🚀 Deployed to Production environment — ${{ vars.RENDER_PROD_URL }}"
